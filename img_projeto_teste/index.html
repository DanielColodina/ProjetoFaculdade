<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In color</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main-login">
        <div class="left-login">
            <h1>InDecor</h1>
            <h2>Um evento para <br>revolucionar sua a <br>criatividade</h2>
            <h2>Data do evento:</h2>
            <h3>Domingo, 28 de Maio, a apartir das 14h</h3>
        </div>
        <div class="right-login">
            <div class="card-login">
                <h2>Preencha o formulário para receber os detalhes do evento</h2>
                <div class="textfield">
                    <label for="nome">Nome</label>
                    <input type="text" name="nome" placeholder="Digite seu nome">
                    <label for="e-mail">E-mail</label>
                    <input type="text" name="e-mail" placeholder="Digite seu melhor e-mail">
                    <label for="telefone">Telefone</label>
                    <input type="text" name="telefone" placeholder="Número de Whatsapp">
                        <label for="principal">Principal interesse</label>
                        <select name="opcao" id="opcao">
                            <option value="" disabled selected>Selecione</option>
                            <option value="opcao1">Lençol</option>
                            <option value="opcao2">Endredom</option>
                            <option value="ocao3">Almofada</option>
                        </select>
                </div>
                <button class="btn-login">Quero me inscrever</button>
            </div>
        </div>
    </div>
</body>
</html>
