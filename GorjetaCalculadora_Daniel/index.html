<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Gorjeta</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js"></script>
</head>

<body>
    <main>
        <h1>Calculadora de gorjeta</h1>
        <form>
            <label for="input-value">Valor da conta:</label>
            <input type="text" id="input-value" name="input-value" placeholder="R$" required>
            <label for="input-rate">Qualidade do serviço:</label>
            <select name="input-rate" id="input-rate">
                <option value="01">Excelente - 10%</option>
                <option value="02">Ótimo - 8%</option>
                <option value="03">Bom - 5%</option>
                <option value="04">Ruim - 2%</option>
            </select>
            <input type="button" id="button" value="Calcular Gorjeta" onclick="calcular()">
            <div class="result-inputs">
                <label for="rate-result">Valor da Gorjeta: </label>
                <input type="text" id="rate-result" name="rate-result" required>
                <label for="total-result">Valor Total:</label>
                <input type="text" id="total-result" name="total-result" required>
            </div>
        </form>
    </main>

</body>

</html>
